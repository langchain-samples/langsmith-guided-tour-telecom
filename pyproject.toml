[project]
name = "telecom-concierge"
version = "0.1.0"
description = "Instructor-led LangSmith workshop — telecom concierge deep agent (Module 01: Traces & Threads)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.12",
    "langchain>=1.0.1",
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.0.1",
    "langgraph-cli[inmem]>=0.4.21",
    "langsmith[strands-agents]>=0.8.0",
    "python-dotenv>=1.1.1",
    "jupyter>=1.1.1",
    "ipywidgets>=8.1.0",
    "grandalf>=0.8",
    "pillow>=10.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["agents", "agents.deployable", "utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
